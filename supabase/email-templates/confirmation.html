<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#080808;color:#f4f4f4;font-family:Arial,sans-serif;padding:32px 16px">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:auto;background:#111;border:1px solid #292929;border-radius:16px;overflow:hidden">
      <tr><td style="padding:34px 30px 18px;font-size:28px;font-weight:700;letter-spacing:-1px">FIO</td></tr>
      <tr><td style="padding:0 30px 8px;font-size:12px;letter-spacing:2px;color:#9a9a9a">CONFIRME SEU E-MAIL</td></tr>
      <tr><td style="padding:0 30px 12px;font-size:28px;line-height:1.15;font-weight:600">Seu acesso está quase pronto.</td></tr>
      <tr><td style="padding:0 30px 24px;color:#b7b7b7;line-height:1.6">Toque no botão abaixo para confirmar seu e-mail e voltar ao FIO.</td></tr>
      <!-- A URL abaixo é preenchida exclusivamente pelo Supabase Auth; não vem de entrada do usuário. -->
      <tr><td style="padding:0 30px 30px"><a href="{{ .ConfirmationURL }}" rel="noopener noreferrer" style="display:block;text-align:center;background:#f2f2ef;color:#080808;text-decoration:none;padding:14px 18px;border-radius:10px;font-weight:700">Confirmar meu e-mail</a></td></tr>
      <tr><td style="padding:0 30px 30px;color:#777;font-size:12px;line-height:1.5">Se você não criou esta conta, pode ignorar esta mensagem.</td></tr>
    </table>
  </body>
</html>
